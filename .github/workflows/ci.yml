name: CI

# Powod istnienia tego pliku: 2026-09-18 stala `65 tok/s` udajaca pomiar
# przeszla przez kod, komentarz i demo. Sygnal byl widoczny (dwie rozne karty,
# jedna liczba) i zostal przeoczony kilka razy. Recenzent, testy i czlowiek
# zawiodly jednoczesnie — wiec to musi sprawdzac maszyna, przy kazdym pushu.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  testy:
    # Macierz systemow, bo kod tozsamosci (M5.2a) ma galezie per system:
    # sciezka macOS `~/Library/Application Support/SIMON` NIGDY nie byla
    # skompilowana, dopoki CI chodzilo wylacznie na Linuksie. Blad w galezi
    # pod `#[cfg(target_os = "macos")]` jest na Linuksie NIEWIDOCZNY — kompilator
    # jej nawet nie oglada.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test offline receipt demo
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The public quickstart must accept the bundled receipt and reject a one-byte change.
          ./target/release/simon --verify-receipt przyklady/receipt.json \\
                                 --expect-output przyklady/odpowiedz.txt

          cp przyklady/odpowiedz.txt "$RUNNER_TEMP/simon-tampered-output.txt"
          printf ' ' >> "$RUNNER_TEMP/simon-tampered-output.txt"
          set +e
          ./target/release/simon --verify-receipt przyklady/receipt.json \\
                                 --expect-output "$RUNNER_TEMP/simon-tampered-output.txt" \\
                                 > "$RUNNER_TEMP/simon-tamper-check.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            cat "$RUNNER_TEMP/simon-tamper-check.log"
            echo "Expected tampered receipt verification to exit 1; got $status" >&2
            exit 1
          fi

      - name: Testy
        run: cargo test --release --locked

      # Clippy nie blokuje builda, ale ma byc widoczny.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  wartownik-stalych:
    # Osobne zadanie, zeby bylo widac W NAZWIE, co pilnuje.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Detektor pomiarow-stalych
        run: cargo test --release -p simon-core pomiar -- --nocapture

      # Sygnatura bledu z 2026-09-18: przepustowosc liczona ze stalej.
      # Wartownik celowo pomija komentarze (opis incydentu ma moc zostac
      # w kodzie) i przeliczenia ms->s, a lapie dzielenie przez stala stawke.
      - name: Wartownik stalych
        run: python3 scripts/wartownik_stalych.py crates
